name = "discogs-mcp"
main = "src/index-oauth.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Hourly cron — drives the collection-sync background refresh.
# See src/index-oauth.ts scheduled() handler.
[triggers]
crons = ["0 * * * *"]

# Optional allowlist: numeric Discogs user ID(s) permitted to authenticate.
# Accepts a single ID or a comma-separated list (e.g. "123,456,789").
# Empty = no allowlist (open; default for local dev and self-hosters).
[vars]
ALLOWED_DISCOGS_USER_ID = ""

# Durable Object for coordinated Discogs API rate limiting
[durable_objects]
bindings = [
  { name = "RATE_LIMITER", class_name = "DiscogsRateLimiter" }
]

[[migrations]]
tag = "v1"
new_classes = ["DiscogsRateLimiter"]

# Top-level config doubles as (a) the maintainer's local `wrangler dev` /
# preview deploy target, and (b) the template the "Deploy to Cloudflare" button
# clones into a self-hoster's account. The button auto-provisions fresh KV
# namespaces and rewrites the `id` fields below in the user's fork. The IDs
# committed here belong to the maintainer's account; they will fail any
# unrelated `wrangler deploy` (account boundary), which is the desired safety
# net — self-hosters can't accidentally write to the maintainer's namespaces.
# Maintainer's hosted instance (discogs-mcp.com) deploys against
# [env.production] below via `npm run deploy:prod`.
[[kv_namespaces]]
binding = "MCP_SESSIONS"
id = "a0bc40f523d54a6ab70fa947ac3daeaf"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "e04a5ec5441949ebb6e84281bf6598c3"

# Production environment
[env.production]
name = "discogs-mcp-prod"

# Lock the hosted instance to the maintainer's Discogs account.
# Discogs API rate limits are too tight to share, so anyone else must self-host.
[env.production.vars]
ALLOWED_DISCOGS_USER_ID = "2579319,2316828"

[env.production.durable_objects]
bindings = [
  { name = "RATE_LIMITER", class_name = "DiscogsRateLimiter" }
]

[env.production.triggers]
crons = ["0 * * * *"]

[[env.production.kv_namespaces]]
binding = "MCP_SESSIONS"
id = "e45edcc5347e4b409169c1d0a9b2ed5d"

[[env.production.kv_namespaces]]
binding = "OAUTH_KV"
id = "35c396a7d0924dd8a5527334cd4538d3"

# Secrets — declared in .dev.vars.example so the Deploy button prompts for them.
# For the maintainer's hosted instance, set with `wrangler secret put <NAME> --env production`:
# - DISCOGS_CONSUMER_KEY
# - DISCOGS_CONSUMER_SECRET
# - JWT_SECRET
